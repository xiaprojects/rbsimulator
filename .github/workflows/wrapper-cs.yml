# CI/CD for the C# MSFS wrapper (wrapper-cs/, decision D19).
#
#  test     format check, build and unit tests on Linux and Windows
#  package  self-contained single-file rbsim-msfs for win-x64 and linux-x64, each smoke-tested on its
#           own OS, uploaded as artifacts
#  release  on a tag wrapper-cs-v<version>: a GitHub release with both archives and their SHA-256
#
# SimConnect.dll is never built, downloaded or packaged: users install the MSFS SDK (CLAUDE.md rule 7).

name: wrapper-cs

on:
  push:
    branches: [main]
    tags: ['wrapper-cs-v*']
  pull_request:
    paths:
      - 'wrapper-cs/**'
      - '.github/workflows/wrapper-cs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wrapper-cs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  DOTNET_VERSION: '10.0.x'

defaults:
  run:
    working-directory: wrapper-cs

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore RbSim.Wrapper.slnx

      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format RbSim.Wrapper.slnx --verify-no-changes --no-restore

      # The executable builds for the runner's OS (win-x64 or linux-x64), so the whole
      # solution compiles on both sides.
      - name: Build
        run: dotnet build RbSim.Wrapper.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RbSim.Wrapper.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: wrapper-cs/TestResults
          retention-days: 7

  package:
    name: package (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: rbsim-msfs.exe
          # Linux: the synthetic source, serial outputs and the RB-01 HMI; the msfs source needs Windows.
          - os: ubuntu-latest
            rid: linux-x64
            exe: rbsim-msfs
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/wrapper-cs-v*') {
            $v = $env:GITHUB_REF_NAME.Substring('wrapper-cs-v'.Length)
          } else {
            $base = (dotnet msbuild src/RbSim.Msfs/RbSim.Msfs.csproj -getProperty:Version).Trim()
            $v = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "not a semantic version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "rbsim-msfs $v"

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/RbSim.Msfs/RbSim.Msfs.csproj -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IsTransformWebConfigDisabled=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -p:SourceRevisionId=${{ github.sha }}
          -o out

      - name: No simulator SDK binaries
        shell: pwsh
        run: |
          $found = Get-ChildItem out -Recurse -Filter 'SimConnect*.dll'
          if ($found) { throw "SimConnect binaries must never be packaged: $($found.FullName -join ', ')" }

      - name: Smoke test
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe out/${{ matrix.exe }}

      # Windows: a flat zip. Linux: a tar.gz with a top folder, which keeps the executable bit, and
      # libSystem.IO.Ports.Native.so, the serial port's native half, beside the executable.
      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "rbsim-msfs-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          $files = @('out/${{ matrix.exe }}', 'out/rbsim-msfs.example.json', 'README.md', '../LICENSE')
          if ($IsLinux) { $files += 'out/libSystem.IO.Ports.Native.so' }
          # the RB-01 HMI's shared files (wwwroot beside the executable), when the build has them
          if (Test-Path out/wwwroot) { $files += 'out/wwwroot' }
          Copy-Item $files $stage -Recurse
          if ($IsWindows) {
            $archive = "$name.zip"
            Compress-Archive -Path "$stage/*" -DestinationPath (Join-Path $env:RUNNER_TEMP $archive)
          } else {
            $archive = "$name.tar.gz"
            tar -czf (Join-Path $env:RUNNER_TEMP $archive) -C $env:RUNNER_TEMP $name
            if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          }
          $hash = (Get-FileHash (Join-Path $env:RUNNER_TEMP $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii -NoNewline (Join-Path $env:RUNNER_TEMP "$archive.sha256")
          "archive=$archive" >> $env:GITHUB_OUTPUT
          Write-Host "$archive $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: rbsim-msfs-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/${{ steps.package.outputs.archive }}
            ${{ runner.temp }}/${{ steps.package.outputs.archive }}.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/wrapper-cs-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rbsim-msfs-*
          merge-multiple: true
          path: dist

      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          rbsim-msfs $VERSION: MSFS 2020/2024 SimConnect to RB avionics status over HTTP, WebSocket
          and USB serial (NMEA, FLARM and RB sentences).

          - Self-contained: no .NET install needed.
          - **Windows x64** (\`-win-x64.zip\`): unzip and run \`rbsim-msfs.exe --help\`. The msfs source needs
            the MSFS SDK for \`SimConnect.dll\` (Developer Mode > Help > SDK Installer); it is not bundled.
          - **Linux x64** (\`-linux-x64.tar.gz\`): the synthetic source, the serial outputs and the RB-01 HMI
            (\`rb01_web_dir\`); the msfs source needs Windows. Keep \`libSystem.IO.Ports.Native.so\` beside
            \`rbsim-msfs\`.
          - Copy \`rbsim-msfs.example.json\` to \`rbsim-msfs.json\` to configure the serial outputs.
          - SIMULATOR USE ONLY. NOT FOR FLIGHT.

          Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}.
          EOF
          gh release create "$GITHUB_REF_NAME" ./*.zip ./*.tar.gz ./*.sha256 \
            --title "rbsim-msfs $VERSION" --notes-file notes.md --verify-tag $prerelease
